# Kopieer dit bestand naar go2rtc.yaml en vul je eigen adressen in.
# go2rtc.yaml staat in .gitignore: de codes in de RTSP-adressen geven toegang tot je camera's.

# Vervang UNIFI_IP en de codes door de RTSP-adressen uit UniFi Protect:
#   Protect > camera > Instellingen > Geavanceerd > RTSP(S) > zet "Gemiddeld" aan en kopieer het adres.
# Je krijgt iets als  rtsps://192.168.1.1:7441/AbCdEf123?enableSrtp
# Schrijf het hier als rtspx://192.168.1.1:7441/AbCdEf123  (rtspx, en zonder ?enableSrtp)

api:
  listen: ":1984"
  origin: "*"          # het dashboard mag de streams insluiten

streams:
  deurbel:    rtspx://UNIFI_IP:7441/CODE_DEURBEL
  g4_bullet:  rtspx://UNIFI_IP:7441/CODE_G4_BULLET
  g4_dome:    rtspx://UNIFI_IP:7441/CODE_G4_DOME
  g3_instant: rtspx://UNIFI_IP:7441/CODE_G3_INSTANT
