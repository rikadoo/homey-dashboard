# Copy this file to go2rtc.yaml and fill in your own camera addresses.
# go2rtc.yaml is in .gitignore: the codes in RTSP addresses give access to your cameras.
#
# UniFi Protect: camera > Settings > Advanced > RTSP(S) > enable "Medium" and copy the address.
# You get something like  rtsps://192.168.1.1:7441/AbCdEf123?enableSrtp
# Write it here as        rtspx://192.168.1.1:7441/AbCdEf123   (rtspx, without ?enableSrtp)
# Other cameras: use their regular rtsp:// address.
#
# The names on the left (doorbell, garden, ...) are what you enter as "Live stream" in a camera tile.

api:
  listen: ":1984"
  origin: "*"          # allow the dashboard to embed the streams

streams:
  doorbell: rtspx://UNIFI_IP:7441/CODE_DOORBELL
  garden:   rtspx://UNIFI_IP:7441/CODE_GARDEN
  driveway: rtsp://user:password@192.168.1.20:554/stream1
